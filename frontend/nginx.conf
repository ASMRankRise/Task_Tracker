server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://task-management-api.rankrise-operations.workers.dev;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name task-management-api.rankrise-operations.workers.dev;
        proxy_set_header Host task-management-api.rankrise-operations.workers.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
